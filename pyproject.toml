[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taskflow"
version = "0.1.0"
description = "Sistema Pessoal de Captura Autônoma e Gestão Correlacionada de Tarefas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "aiosqlite>=0.20.0",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.1",
    "cryptography>=42.0.5",
    "google-genai>=0.1.0",
    "msal>=1.28.0",
    "pywin32>=306; sys_platform == 'win32'",
    "asyncpg>=0.29.0",
    "tzdata>=2025.2; sys_platform == 'win32'",
    "alembic>=1.13.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
taskflow = "taskflow.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
    "pytest-env>=1.1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".agent",
    "src/taskflow/adapters/api/routers/oauth_openai.py",
    "src/taskflow/adapters/llm/chatgpt_subscription.py",
    "tests/unit/adapters/test_chatgpt_subscription.py",
]


[tool.ruff.lint]
ignore = [
    "B008",    # FastAPI Depends() como default arg
    "SIM102",  # nested if — legibilidade de políticas de negócio
    "SIM103",  # return cond diretamente — legibilidade de políticas
    "DTZ001",  # datetime sem tz — sistema monousuário com UTC implícito
    "DTZ003",  # datetime.utcnow() — aceito para MVP (sem multi-tenant)
    "DTZ901",  # datetime.min sem tz — aceito para MVP
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src", "apps"]
exclude = "(oauth_openai|chatgpt_subscription)"

[tool.coverage.run]
source = ["src/taskflow"]
omit = [
    "src/taskflow/adapters/api/routers/oauth_openai.py",
    "src/taskflow/adapters/llm/chatgpt_subscription.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

[tool.coverage.paths]
source = ["src/taskflow", "*/site-packages/taskflow"]
