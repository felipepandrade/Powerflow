name: Powerflow CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: powerflow-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  ENCRYPTION_KEY: cG93ZXJmbG93LWNpLWtleS0zMi1ieXRlcy1sb25nISE=
  DATABASE_URL: sqlite+aiosqlite:///./data/ci.db

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Ruff
        run: ruff check .

      - name: Mypy strict
        run: mypy src apps

      - name: Migrate test database
        run: alembic upgrade head

      - name: Backend tests and global coverage
        run: >
          pytest
          --ignore=tests/unit/adapters/test_chatgpt_subscription.py
          --cov=src/taskflow
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80

      - name: Domain coverage
        run: >
          pytest tests/unit/domain
          --cov=src/taskflow/domain
          --cov-report=term-missing
          --cov-fail-under=90

      - name: Fresh migration smoke
        run: |
          rm -f data/migration-smoke.db
          DATABASE_URL=sqlite+aiosqlite:///./data/migration-smoke.db alembic upgrade head
          DATABASE_URL=sqlite+aiosqlite:///./data/migration-smoke.db alembic downgrade base
          DATABASE_URL=sqlite+aiosqlite:///./data/migration-smoke.db alembic upgrade head
          DATABASE_URL=sqlite+aiosqlite:///./data/migration-smoke.db alembic check
      - name: Application startup smoke
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from taskflow.main import create_app
          with TestClient(create_app()) as client:
              assert client.get("/health/live").status_code == 200
              assert client.get("/health/ready").status_code == 200
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Compose environment
        run: cp .env.example .env
      - name: Validate Compose
        run: docker compose -f infra/compose/local.yml config --quiet
      - name: Build API and frontend images
        run: docker compose -f infra/compose/local.yml build api frontend
